name: ci

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest
      - run: gr00t-g1 demo --episodes 2
