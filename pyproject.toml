[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-gr00t"
version = "0.1.0"
description = "End-to-end NVIDIA Isaac GR00T N1.7 + GEAR-SONIC project for Unitree G1"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Unitree GR00T Project" }]
dependencies = []

[project.optional-dependencies]
dev = ["numpy>=1.26,<2", "pytest>=8.0", "ruff>=0.8"]
a1-data = ["h5py>=3.12,<4", "pandas>=2.2,<3", "pyarrow>=18,<24"]

[project.scripts]
gr00t-g1 = "unitree_gr00t.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
