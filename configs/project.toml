[project]
name = "unitree-g1-gr00t-generalist"
artifact_dir = "artifacts"

[upstream]
root = ".upstream"
isaac_gr00t_repo = "https://github.com/NVIDIA/Isaac-GR00T.git"
isaac_gr00t_revision = "4b1dca9d88d2a0b9ea5a65aa61c82ff89f5c4f0e"
isaac_gr00t_dirname = "Isaac-GR00T-N1.7"
sonic_repo = "https://github.com/NVlabs/GR00T-WholeBodyControl.git"
sonic_revision = "a0732b642c0333077e127a2f56ab0014c196bca4"
sonic_dirname = "GR00T-WholeBodyControl"
robocerebra_repo = "https://github.com/buaa-colalab/RoboCerebra.git"
robocerebra_revision = "2573426c13dfcd5e7d7831c15587b058aaa1c0c0"
robocerebra_dirname = "RoboCerebra"
sparkvla_repo = "https://github.com/huhuhushou/SparkVLA.git"
sparkvla_revision = "ae90ec94ccc77a1e6745e4f5bcc94e05502d8cbf"
sparkvla_dirname = "SparkVLA"

[robocerebra]
dataset = "qiukingballball/RoboCerebraBench"
dataset_revision = "4e386b9aa266f05b199739d7b58950252244ea21"
model = "nvidia/GR00T-N1.7-LIBERO"
model_revision = "2ea293aa20ba7cf5bbf3ba17a5fbcb1a01cbfe21"
checkpoint_subdir = "libero_10"
checkpoint_dir = "checkpoints/robocerebra/GR00T-N1.7-LIBERO/libero_10"
benchmark_dir = ".cache/robocerebra/bench"
embodiment = "LIBERO_PANDA"
task_types = [
  "Ideal",
  "Memory_Execution",
  "Memory_Exploration",
  "Mix",
  "Observation_Mismatching",
  "Random_Disturbance",
]
trials_per_task = 10
control_frequency_hz = 20
action_horizon = 16
fixed_execution_horizons = [8, 16]
steps_per_subtask = 150
initial_wait_steps = 15
post_success_observation_steps = 80

[robocerebra_posttrain]
experiment_id = "A1"
variant = "GR00T-RC"
training_dataset = "qiukingballball/RoboCerebra"
training_dataset_revision = "5d2e1e361bf65aabbe4d18179515f5a10936cc96"
training_manifest = ".cache/robocerebra/train/RoboCerebra_trainset/trainingset.json"
training_manifest_sha256 = "3211be95643a2ff8fdda2253267137272617821ac93ae827fd12355e7a39d46f"
raw_training_dir = ".cache/robocerebra/train/RoboCerebra_trainset"
lerobot_training_dir = "outputs/robocerebra/gr00t-lerobot-v2"
base_checkpoint_dir = "checkpoints/robocerebra/GR00T-N1.7-LIBERO/libero_10"
checkpoint_dir = "checkpoints/robocerebra/GR00T-RC"
expected_training_manifest_rows = 1000
# The pinned source has four missing HDF5 demos and one missing authoritative BDDL.
expected_training_episodes = 995
download_workers = 32
conversion_workers = 10
dataset_fps = 20
max_steps = 20000
# Pilot-selected maximum stable throughput on the 16 GiB RTX 5070 Ti.
micro_batch_size = 2
gradient_accumulation_steps = 16
dataloader_workers = 8
learning_rate = 1e-4
state_dropout_probability = 0.2
save_steps = 1000

[robocerebra_hierarchy]
experiment_id = "A2"
variant = "GR00T-RC-fixed-hierarchy"
planner = "RoboCerebra-HPE-fixed-anchor-reimplementation"
plan_source = "canonical task_description.txt step annotations"
subgoal_horizon_steps = 150

[robocerebra_selector]
experiment_id = "B"
variant = "GR00T-RC-SparkVLA-style-execution"
method = "SparkVLA-unified-stop-prefix-GR00T-reimplementation"
paper = "arXiv:2608.16172v1"
checkpoint_dir = "checkpoints/robocerebra/GR00T-RC-SparkVLA-selector"
dataset_dir = "outputs/robocerebra/sparkvla-selector-v1"
action_horizon = 16
context_width = 2048
scoring_width = 1024
scoring_layers = 2
scoring_heads = 8
feedforward_width = 4096
boundary_jitter_steps = 2
stop_loss_weight = 1.0
unsuccessful_rank_weight = 0.1
stop_positive_weight = 3.0
near_boundary_steps = 80
near_boundary_stop_weight = 3.0
unsuccessful_stop_weight = 1.5
# The paper only says "short confirmation window". Two is the smallest
# non-trivial window and is frozen before held-out evaluation.
stop_confirmation_window = 2
sample_stride = 8
development_fraction = 0.1
training_seed = 7
max_steps = 20000
batch_size = 128
learning_rate = 3e-4
weight_decay = 0.01
warmup_steps = 1000
gradient_clip_norm = 1.0
save_steps = 1000

[robocerebra_retry]
experiment_id = "B-retry"
variant = "GR00T-RC-SparkVLA-style-execution-naive-retry"
method = "B-plus-fixed-unconditional-single-subtask-retry"
trigger = "first-confirmed-stop-per-subtask"
max_retries_per_subtask = 1
# Retry consumes the existing B episode budget. It never restores simulator
# state and never reads predicates, injection labels, or outcome signals.
preserve_global_step_budget = true
reset_selector_anchor_on_retry = true
failure_detector = false
recovery_memory = false
recovery_policy = false

[robocerebra_recovery]
experiment_id = "Ours"
variant = "GR00T-RC-SparkVLA-counterfactual-temporal-recovery"
method = "counterfactual-temporal-recovery"
parent_experiment = "B"
checkpoint_dir = "checkpoints/robocerebra/GR00T-RC-CTR"
dataset_dir = "outputs/robocerebra/ctr-recovery-v1"
context_width = 2048
temporal_width = 256
temporal_layers = 4
temporal_heads = 8
max_parameters = 15000000
history_lengths = [4, 8, 16]
options = [
  "ACCEPT_B",
  "REOBSERVE",
  "RETRY_CURRENT",
  "BACKTRACK_ONE",
  "ADVANCE",
  "CONSENSUS_PREFIX",
]
consensus_hypotheses = [1, 4, 8]
max_recovery_attempts = [1, 2]
failure_confirmation_window = 2
recovery_completion_confirmation_window = 2
zero_progress_guard = 8
false_recovery_rate_limit = 0.05
overhead_fraction_limit = 0.20
max_search_variants = 12
train_base_seeds = [10007, 11007, 12007]
development_base_seeds = [20007, 21007]
smoke_base_seed = 30007
final_base_seed = 7

[model]
base_model = "nvidia/GR00T-N1.7-3B"
embodiment = "UNITREE_G1_SONIC"
# UNITREE_G1_SONIC is a post-training embodiment. Set this to a fine-tuned
# checkpoint before `serve`; the base checkpoint alone is intentionally rejected.
checkpoint = ""
device = "cuda:0"
host = "127.0.0.1"
bind_host = "0.0.0.0"
port = 5550

[sonic]
variant = "sonic_v1_1"
camera_host = "localhost"
camera_port = 5555
action_publish_rate = 50
action_horizon = 40
record_during_inference = true

[training]
num_gpus = 4
max_steps = 20000
global_batch_size = 32
save_steps = 5000

[safety]
max_cartesian_delta = 0.08
workspace_x = [0.0, 1.0]
workspace_y = [0.0, 1.0]
workspace_z = [0.02, 0.95]
max_episode_steps = 120
